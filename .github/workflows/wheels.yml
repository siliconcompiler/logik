name: Wheels

on:
  workflow_dispatch:
  release:
    types:
      - published

# The repository default is write-all. Default every job to read-only and let
# the two jobs that need to write grant themselves exactly one scope below.
permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - uses: hynek/build-and-inspect-python-package@v2

  publish:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    # Trusted publishing needs the OIDC token and nothing else; downloading a
    # same-run artifact uses the Actions runtime token, not GITHUB_TOKEN.
    permissions:
      contents: none
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@v1.14.2

  save:
    needs: [publish]
    runs-on: ubuntu-latest

    # Uploading release assets is the only write this workflow performs.
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Add wheels to GitHub release artifacts
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.whl
